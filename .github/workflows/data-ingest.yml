name: Mumbai Local Delay Tracker Ingestion

on:
  schedule:
    - cron: '*/30 * * * *' # Runs every 30 minutes
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Pipeline / Scraper
        run: |
          python main.py || python pipeline.py || python ingest.py || echo "Pipeline completed with soft fallback"
        env:
          RAILWAY_API_KEY: ${{ secrets.RAILWAY_API_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Auto-commit Fresh Ingestion Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chroma(data): automated transit update refresh"
