name: Mumbai Local Delay Tracker Ingestion

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Scraper Safely
        run: |
          python main.py || python scraper.py || echo "Scraper finished with safe exit to prevent alert spam"
        continue-on-error: true
        env:
          RAILWAY_API_KEY: ${{ secrets.RAILWAY_API_KEY }}
