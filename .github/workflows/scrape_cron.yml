name: Scrape Mumbai Local Delays

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: python -m pip install --upgrade pip requests

      - name: Persist latest delay update
        env:
          API_URL: ${{ secrets.BACKEND_API_URL }}/api/delays
        run: |
          test -n "$API_URL" || (echo "BACKEND_API_URL secret is required" && exit 1)
          python backend/scraper/mock_scraper.py --count 1
