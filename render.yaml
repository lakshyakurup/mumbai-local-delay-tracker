services:
  - type: web
    name: mumbai-local-delay-tracker-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    plan: starter
    envVars:
      - key: DATABASE_URL
        value: sqlite:////app/data/delay_tracker.db
      - key: CORS_ORIGINS
        sync: false
      - key: SCRAPER_TOKEN
        sync: false
    disk:
      name: delay-tracker-data
      mountPath: /app/data
      sizeGB: 1
  - type: cron
    name: mumbai-local-delay-tracker-scraper
    runtime: python
    schedule: "*/15 * * * *"
    buildCommand: pip install -r backend/requirements.txt
    startCommand: 'curl --fail-with-body --retry 3 -X POST "$SCRAPER_API_URL/api/v2/scraper/run" -H "Authorization: Bearer $SCRAPER_TOKEN"'
    envVars:
      - key: SCRAPER_API_URL
        sync: false
      - key: SCRAPER_TOKEN
        sync: false
